<!DOCTYPE html>
<html><head><style>html, body {
        background-color: #fcb1e3;
        margin: 0px;
        min-height: 700px;
        width: 100%;
        height: 100%;
        width: -webkit-fill-available;
        height: -webkit-fill-available;
      }
      ::backdrop {
        background: none
      }
      dialog {
        background: #fcb1e3;
        border-color: #ff0000;
        border-style: solid;
      }
      dialog.message {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding-block-start: 0px;
      }
      dialog > img[src="https://lepripri.github.io/lepripri/icons/Warning.png"] {
        width: 1em; height: 1em; display: block
      }
      #fileName {
        height: 20px;
        border-radius: 30px;
        border-width: 2px;
        border-style: solid;
        border-color: #ff0000;
        margin: 4px;
        padding-inline: 9px;
        padding-block: 0px;
      }
      button[minus], input[type="files"][minus]::file-selector-button:hover {
        position: absolute;
        font-size: 12px;
        padding: 2px;
        margin: 0px;
        translate: 160px 0px;
      }
      button[minus]:hover, button[minus]:focus, input[type="files"][minus]::file-selector-button:hover, input[type="files"][minus]:focus{
        font-size: 15px;
        translate: 162px;
      }
      button, a, ::file-selector-button{
        background-color: #fcb1e3;
        border-color: #FF0000;
        border-style: solid;
        border-width: 3px;
        padding-inline: 7px;
        padding-block: 5px;
        font-family: arial;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        outline: none !important;
        text-decoration: none;
        color: #000000;
      }
      button:hover, button:focus, a:hover, a:focus, ::file-selector-button:hover, input[type="files"]:focus{
        font-size: 22px;
        translate: -8px 0px;
        margin-inline-end: -30px
      }
      button[not-button] {
        border-style: none;
        background: none;
        font-family: revert;
        cursor: revert;
        font-size: revert;
        translate: revert;
      }
markdown {
    content {
        display: none;
    }
    display {
        code[notpre] {
            border: 1px solid #ccc;
            background: #f9f9f9;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
        pre {
            background: #f9f9f9;
            font-size: 0px;
            margin-block: 5px;
            div {
                display: flex;
                justify-content: space-between;
                font-size: 20px;
                border-block-end-style: solid;
                border-width: 1px;
                padding: 6px
            }
            code {
                padding-inline: 6px;
                margin-block: 6px;
                display: block;
                font-family: monospace;
                font-size: initial;
            }
        }
    }
}
::selection {
    background: linear-gradient(#000000, #ff0000, #00ff00, #0000ff, #ffff00, #ff00ff, #00ffff, #ffffff), #ffff00;
    color: #ff0000;
}
* {
    font-family: sans-serif;
}</style></head><body><h1>site bloqué</h1><p>Le développeur de le pripri (Camille MELIN--JULIEN) a décidé de bloquer ce site temporairement.</p>
